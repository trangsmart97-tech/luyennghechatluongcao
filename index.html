<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện nghe chất lượng cao – Trạm Tư Duy</title>
<style>
  :root { --nen: #f6f4ee; --the: #fff; --chu: #1f2a37; --chu-nhat: #5b6676; --chinh: #0f6e6e; --chinh-nhat: #e2f1f0; --vien: #d9d4c7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--nen); color: var(--chu);
    font-family: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif; font-size: 17px; line-height: 1.55; }
  header { background: var(--chinh); color: #fff; padding: 26px 16px; }
  header div, main { max-width: 760px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 27px; }
  header p { margin: 0; color: #d6efee; }
  main { padding: 16px; }
  h2 { font-size: 18px; color: var(--chinh); margin: 22px 0 8px; }
  a.bai { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--the);
    border: 1px solid var(--vien); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; color: inherit; text-decoration: none; }
  a.bai:hover, a.bai:focus { border-color: var(--chinh); background: var(--chinh-nhat); outline: none; }
  a.bai strong { display: block; }
  a.bai small { color: var(--chu-nhat); }
  a.bai span.di { color: var(--chinh); font-weight: 700; white-space: nowrap; }
  .trong { color: var(--chu-nhat); }
</style>
</head>
<body>
<header><div>
  <h1>Luyện nghe chất lượng cao</h1>
  <p>Tiếng Anh thật, nghe như trong phòng thi. Con chọn bài của tuần này nhé.</p>
</div></header>
<main id="ds"><p class="trong">Đang mở danh sách bài…</p></main>
<script>
(function () {
  "use strict";
  var ds = document.getElementById("ds");
  function tao(the, chu, lop) { var e = document.createElement(the); if (chu) e.textContent = chu; if (lop) e.className = lop; return e; }
  fetch("bai/danh-sach.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (cac) {
      ds.textContent = "";
      if (!cac.length) { ds.appendChild(tao("p", "Chưa có bài nghe nào.", "trong")); return; }
      var tuanTruoc = null;
      cac.forEach(function (b) {
        if (b.tuan !== tuanTruoc) { ds.appendChild(tao("h2", "Tuần " + b.tuan)); tuanTruoc = b.tuan; }
        var a = tao("a", null, "bai");
        a.href = "nghe.html?bai=" + encodeURIComponent(b.ma);
        var trai = tao("div");
        trai.appendChild(tao("strong", b.tieuDe));
        trai.appendChild(tao("small", [b.bac, b.giong ? "Giọng " + b.giong : "", b.thoiLuong].filter(Boolean).join(", ")));
        a.appendChild(trai);
        a.appendChild(tao("span", "Nghe →", "di"));
        ds.appendChild(a);
      });
    })
    .catch(function () { ds.textContent = "Chưa mở được danh sách bài. Con báo cô giúp nhé."; });
})();
</script>
</body>
</html>
